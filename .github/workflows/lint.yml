name: lint
on: [push, pull_request]
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: tests/lint.sh
      - run: bash tests/epas-detect-unit.sh
      - run: bash tests/epas-ssl-unit.sh
      - run: bash tests/epas-layout-unit.sh
      - run: bash tests/logger-unit.sh
