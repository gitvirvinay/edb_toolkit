name: lint
on: [push, pull_request]
jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: tests/lint.sh
      - run: bash tests/epas-detect-unit.sh
      - run: bash tests/epas-ssl-unit.sh
      - run: bash tests/epas-layout-unit.sh
      - run: bash tests/epas-tde-unit.sh
      - run: bash tests/logger-unit.sh
      - run: bash tests/common-unit.sh
      - run: bash tests/backup-unit.sh
      - run: bash tests/restore-test-unit.sh
      - run: bash tests/efm-reconfigure-unit.sh
      - run: bash tests/efm-setup-unit.sh
      - run: bash tests/paste-kit-unit.sh
